# Deploys Rancher and prepares it for performance tests

tofu_main_directory: ./tofu/main/harvester
tofu_parallelism: 50 # default is 10, but Harvester tolerates higher values well
#tofu_workspace: h7r

cluster_batch_size: 50

tofu_variables:
  project_name: prairie
  namespace: default

  #  Add the path to your Harvester kubeconfig. Get one with these instructions:
  #  https://docs.harvesterhci.io/v1.3/faq/#how-can-i-access-the-kubeconfig-file-of-the-harvester-cluster
  kubeconfig: /root/go/src/github.com/rancher/dartboard/h.yaml # default to file pointed by the KUBECONFIG environment variable

  ssh_public_key_path: ~/.ssh/id_rsa.pub
  ssh_private_key_path: ~/.ssh/id_rsa
  ssh_user: opensuse

  create_image: false

  network:
    create: false
    name: vm-net-2085
    clusternetwork_name: cluster-net
    vlan_id: 2085
    namespace: default
    interface_type: bridge
    interface_model: virtio
    public: true
    wait_for_lease: true

  upstream_cluster:
    server_count: 3
    agent_count: 2
    distro_version: v1.32.6+rke2r1
    public_ip: false
    reserve_node_for_monitoring: false
    enable_audit_log: false
    create_tunnels: false
    lb_node_module_variables:
      cpu: 64
      memory: 128
      disks:
        - name: "disk-0"
          size: 128
          type: "disk"
          bus: "virtio"
      password: linux # Non-SSH password
      image_name: opensuse-leap-15.6-minimal-noipv6-longhorn-singular # openSUSE Leap 15.6. Change to a valid Harvester image name to override
      image_namespace: default # default to the same namespace above
      node_selector:
        dartboard-role: rancher
      ssh_shared_public_keys: [
        { name: ck-cannon01, namespace: default },
      ]
      tags: {}
    node_module_variables:
      cpu: 64
      memory: 256
      disks:
        - name: "disk-0"
          size: 200
          type: "disk"
          bus: "virtio"
      password: linux # Non-SSH password
      image_name: opensuse-leap-15.6-minimal-noipv6-longhorn-singular # openSUSE Leap 15.6. Change to a valid Harvester image name to override
      image_namespace: default # default to the same namespace above
      node_selector:
        dartboard-role: rancher
      ssh_shared_public_keys: [
        { name: ck-cannon01, namespace: default },
      ]
      tags: {}

  upstream_cluster_distro_module: generic/rke2
  tester_cluster_distro_module: generic/k3s
  downstream_cluster_templates:
    - cluster_count: 1000
      server_count: 1
      agent_count: 0
      is_custom_cluster: true
      distro_version: v1.32.3+k3s1
      public_ip: false
      reserve_node_for_monitoring: false
      enable_audit_log: false
      create_tunnels: false
      machine_pools:                              #required(dynamic only) (at least 1 controlplane & etcd & worker)
        - machine_pool_config:                      #required(dynamic only) (at least 1)
            etcd: true
            controlplane: true
            worker: true
            quantity: 1
      node_module_variables:
        cpu: 2
        memory: 4
        disks:
          - name: "disk-0"
            size: 35
            type: "disk"
            bus: "virtio"
        password: linux # Non-SSH password
        image_name: opensuse-leap-15.6-minimal-noipv6-longhorn-singular # openSUSE Leap 15.6. Change to a valid Harvester image name to override
        image_namespace: default # default to the same namespace above
        ssh_shared_public_keys: [
          { name: ck-cannon01, namespace: default },
        ]
        tags: {}
        node_selector:
          dartboard-role: not-rancher
    - cluster_count: 150
      server_count: 1
      agent_count: 0
      is_custom_cluster: true
      distro_version: v1.32.3+k3s1
      public_ip: false
      reserve_node_for_monitoring: false
      enable_audit_log: false
      create_tunnels: false
      machine_pools:                              #required(dynamic only) (at least 1 controlplane & etcd & worker)
        - machine_pool_config:                      #required(dynamic only) (at least 1)
            etcd: true
            controlplane: true
            worker: true
            quantity: 1
      node_module_variables:
        cpu: 2
        memory: 4
        disks:
          - name: "disk-0"
            size: 35
            type: "disk"
            bus: "virtio"
        password: linux # Non-SSH password
        image_name: opensuse-leap-15.6-minimal-noipv6-longhorn-singular # openSUSE Leap 15.6. Change to a valid Harvester image name to override
        image_namespace: default # default to the same namespace above
        ssh_shared_public_keys: [
          { name: ck-cannon01, namespace: default },
        ]
        tags: {}
        node_selector:
          dartboard-role: not-rancher
  downstream_cluster_distro_module: generic/k3s

  first_kubernetes_api_port: 7445
  first_app_http_port: 9080
  first_app_https_port: 9443

chart_variables:
  rancher_replicas: 5
  downstream_rancher_monitoring: false
  admin_password: adminadminadmin
  rancher_monitoring_version: 106.1.1+up69.8.2-rancher.5 # see https://github.com/rancher/charts/tree/release-v2.11/assets/rancher-monitoring-crd
  cert_manager_version: 1.17.0
  tester_grafana_version: 8.10.4
  rancher_version: 2.11.1
  # rancher_chart_repo_override:
  force_prime_registry: false
    # extra_environment_variables:
    # - name: CATTLE_FEATURES
    #   value: aggregated-roletemplates=true
    # - name: CATTLE_AGENT_IMAGE
  #   value: ""

# Use the following for 2.8.6:
#  rancher_version: 2.8.6
#  rancher_monitoring_version: 103.1.1+up45.31.1 # see https://github.com/rancher/charts/tree/release-v2.8/assets/rancher-monitoring-crd

# Add the following to set a custom image:
#  rancher_image_override: rancher/rancher
#  rancher_image_tag_override: v2.8.6-debug-1

test_variables:
  test_config_maps: 0
  test_secrets: 0
  test_roles: 0
  test_users: 0
  test_projects: 0
